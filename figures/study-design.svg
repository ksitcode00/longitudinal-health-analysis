<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">Three-phase longitudinal survey design</title>
  <desc id="desc">A repeated-measures survey design with three heatwave study phases and participant-level longitudinal analysis.</desc>
  <rect width="1040" height="420" fill="#ffffff"/>
  <text x="70" y="72" fill="#132238" font-family="Arial, sans-serif" font-size="30" font-weight="700">Repeated-measures study design</text>
  <text x="70" y="110" fill="#5e6b7a" font-family="Arial, sans-serif" font-size="18">Three survey phases linked at the participant level</text>
  <line x1="225" y1="235" x2="815" y2="235" stroke="#afbecb" stroke-width="5"/>
  <polygon points="815,235 790,220 790,250" fill="#afbecb"/>
  <g font-family="Arial, sans-serif">
    <circle cx="250" cy="235" r="65" fill="#e6f2f3" stroke="#247b84" stroke-width="3"/>
    <text x="250" y="228" text-anchor="middle" fill="#132238" font-size="24" font-weight="700">Phase 1</text>
    <text x="250" y="258" text-anchor="middle" fill="#5e6b7a" font-size="16">baseline survey</text>
    <circle cx="520" cy="235" r="65" fill="#e6f2f3" stroke="#247b84" stroke-width="3"/>
    <text x="520" y="228" text-anchor="middle" fill="#132238" font-size="24" font-weight="700">Phase 2</text>
    <text x="520" y="258" text-anchor="middle" fill="#5e6b7a" font-size="16">follow-up survey</text>
    <circle cx="790" cy="235" r="65" fill="#e6f2f3" stroke="#247b84" stroke-width="3"/>
    <text x="790" y="228" text-anchor="middle" fill="#132238" font-size="24" font-weight="700">Phase 3</text>
    <text x="790" y="258" text-anchor="middle" fill="#5e6b7a" font-size="16">follow-up survey</text>
  </g>
  <text x="520" y="365" text-anchor="middle" fill="#5e6b7a" font-family="Arial, sans-serif" font-size="17">Wide-to-long transformation → GLMM and GEE models account for correlated responses</text>
</svg>
